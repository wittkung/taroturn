[workspace]
resolver = "2"
members = [
    "crates/taroturn-core",
    "crates/taroturn-cli",
    "crates/taroturn-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Taroturn Engineering Team <team@taroturn.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/taroturn/taroturn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3"
uniffi = "0.28"
