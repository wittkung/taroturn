server:
  port: 8080

spring:
  application:
    name: taroturn-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taroturn}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

taroturn:
  jwt:
    secret: ${TAROTURN_JWT_SECRET:d4af37bamboo2e8b57cinnabarc84b31washi0b0b0c1c1c1e_taroturn_kintsugi_gold_jwt_secret_key_2026}
    expiration-ms: 2592000000 # 30 days
  wechat:
    app-id: ${WECHAT_APP_ID:wx_mock_appid_123456}
    app-secret: ${WECHAT_APP_SECRET:wx_mock_secret_abcdef}
